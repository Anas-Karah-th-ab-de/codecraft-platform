[package]
name = "codecraft-agent"
description = "Geräte-Agent für Kunden-PCs, KI-Appliance und POS: meldet Status an die Plattform"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
codecraft-protocol.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
