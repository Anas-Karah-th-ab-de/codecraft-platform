[package]
name = "codecraft-agent"
description = "Geräte-Agent für Kunden-PCs, KI-Appliance und POS: Status, Fernwartung (Bild, Befehle, Dateien)"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "codecraft_agent"
path = "src/lib.rs"

[[bin]]
name = "codecraft-agent"
path = "src/main.rs"

[dependencies]
codecraft-protocol = { workspace = true, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk", "network"] }
tokio = { workspace = true, features = ["process", "fs", "io-util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
uuid.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xtest"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
