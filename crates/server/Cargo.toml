[package]
name = "codecraft-server"
description = "API-Server der KM-Code-Craft-Plattform (Axum + PostgreSQL)"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "codecraft-server"
path = "src/main.rs"

[dependencies]
codecraft-domain.workspace = true
codecraft-protocol.workspace = true
axum = { version = "0.8", features = ["multipart", "ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tower-http = { version = "0.6", features = ["trace", "cors", "limit", "fs", "compression-gzip", "set-header"] }
argon2 = "0.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
totp-rs = { version = "5", features = ["qr", "gen_secret", "otpauth"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate", "json", "macros"] }
serde = { workspace = true, features = ["std"] }
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
tokio = { workspace = true, features = ["process", "fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true
sha2 = "0.10"
aes-gcm = "0.10"
hmac = "0.12"
sha1 = "0.10"
md5 = { package = "md-5", version = "0.10" }
hex = "0.4"
rand = "0.8"
mail-parser = "1.0"
mail-builder = "2.0.1"
mail-auth = { version = "0.15", default-features = false, features = ["rust-crypto", "dns-hickory", "generate"] }
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config", "tokio"] }
webpki-roots = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pemfile = "2.2.0"
base64 = "0.23.1"
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
hkdf = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "0.26"
