# Maps Syria: TLS hier, Inhalte vom nginx-Container (127.0.0.1:8081, unterscheidet maps/apimap am Host-Namen)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name maps.code-craft.tech apimap.code-craft.tech;
    ssl_certificate /etc/letsencrypt/live/maps.code-craft.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maps.code-craft.tech/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
