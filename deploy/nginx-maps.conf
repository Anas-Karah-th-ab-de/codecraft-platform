# Maps Syria: TLS hier, Inhalte vom nginx-Container (127.0.0.1:8081, unterscheidet maps/apimap am Host-Namen)
# Löschen bremsen: höchstens 6 Löschaufrufe je Minute und Adresse (Schutz vor massenhaftem Löschen)
map $request_method $maps_delete_key { DELETE $binary_remote_addr; default ""; }
limit_req_zone $maps_delete_key zone=maps_delete:10m rate=6r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name maps.code-craft.tech apimap.code-craft.tech;
    ssl_certificate /etc/letsencrypt/live/maps.code-craft.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maps.code-craft.tech/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    client_max_body_size 50m;
    limit_req zone=maps_delete burst=4 nodelay;
    limit_req_status 429;

    # Schnittstellen-Beschreibung nicht öffentlich ausliefern
    location ~ ^/api/(docs|redoc|openapi\.json) { return 404; }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
