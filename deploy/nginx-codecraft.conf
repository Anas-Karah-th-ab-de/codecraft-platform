# nginx auf dem Produktionsserver: TLS, Plattform (127.0.0.1:8090), Maps (127.0.0.1:8081), Weiterleitungen.
# Zertifikate: certbot (code-craft.tech, mail.code-craft.tech, legacy.code-craft.tech, maps.code-craft.tech)

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# ssl_protocols/ssl_prefer_server_ciphers kommen aus /etc/nginx/nginx.conf
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;

# ── HTTP: ACME + Umleitung auf HTTPS ───────────────────────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# ── Plattform: Webseite, Portal, API, WebSocket, Ereignis-Stream ───────────
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name code-craft.tech;
    ssl_certificate /etc/letsencrypt/live/code-craft.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/code-craft.tech/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 60m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
    # App-Downloads (APK/.deb) liegen außerhalb des Web-Builds, damit Deploys sie nicht löschen
    location ~ ^/downloads/(km-portal(-fernsteuerung\.apk|\.apk|_amd64\.deb)|app-version\.json)$ {
        root /var/www;
        types { application/vnd.android.package-archive apk; application/vnd.debian.binary-package deb; application/json json; }
        # keine bedingten Antworten (304): Chrome lädt in parallelen Teilen und bleibt sonst bei 100 % hängen
        etag off;
        if_modified_since off;
        add_header Cache-Control "no-store" always;
        add_header Content-Disposition "attachment" always;
    }
    # Ereignis-Stream (App, VS Code): nicht puffern
    location = /api/v1/events {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}

# www → ohne www (Zertifikat kommt nach der DNS-Umstellung dazu)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.code-craft.tech;
    ssl_certificate /etc/letsencrypt/live/code-craft.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/code-craft.tech/privkey.pem;
    return 301 https://code-craft.tech$request_uri;
}

# ── Mail-Namen: Webmail → Portal ───────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mail.code-craft.tech webmail.code-craft.tech imap.code-craft.tech smtp.code-craft.tech
                autoconfig.code-craft.tech autodiscover.code-craft.tech;
    ssl_certificate /etc/letsencrypt/live/mail.code-craft.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.code-craft.tech/privkey.pem;
    return 301 https://code-craft.tech/portal/mail;
}

# ── Alte Portale und abgelöste Dienste → neues Portal ──────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name customer.code-craft.tech employee.code-craft.tech portal.code-craft.tech team.code-craft.tech;
    ssl_certificate /etc/letsencrypt/live/legacy.code-craft.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/legacy.code-craft.tech/privkey.pem;
    return 301 https://code-craft.tech/portal;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name element.code-craft.tech matrix.code-craft.tech livekit.code-craft.tech rustdesk.code-craft.tech turn.code-craft.tech;
    ssl_certificate /etc/letsencrypt/live/legacy.code-craft.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/legacy.code-craft.tech/privkey.pem;
    return 301 https://code-craft.tech/portal/nachrichten;
}

# ── Maps Syria (Docker, nginx-Container auf 127.0.0.1:8081) ─────────────────
# Wird von deploy/nginx-maps.conf ergänzt, sobald das Zertifikat da ist.
